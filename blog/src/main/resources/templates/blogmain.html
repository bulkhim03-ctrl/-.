<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Тест вывода статей</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Проверка вывода статей из БД</h1>
    
    <div th:each="el : ${posts}">
        <hr>
        <p><strong>ID:</strong> <span th:text="${el.id}"></span></p>
        <p><strong>Заголовок:</strong> <span th:text="${el.title}"></span></p>
        <p><strong>Анонс:</strong> <span th:text="${el.anons}"></span></p>
        <p><strong>Полный текст:</strong> <span th:text="${el.text_full}"></span></p>
        <p><strong>Просмотры:</strong> <span th:text="${el.views}"></span></p>
        <p><strong>Дата:</strong> <span th:text="${#temporals.format(el.date, 'dd.MM.yyyy HH:mm')}"></span></p>
        <hr>
    </div>
    
    <div th:if="${posts == null or posts.empty}">
        <p style="color: red;">Нет статей в базе данных!</p>
    </div>

</body>
</html>
