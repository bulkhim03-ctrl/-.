<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        input { margin: 10px; padding: 8px; width: 200px; }
        button { padding: 8px 20px; background: #333; color: white; border: none; cursor: pointer; }
        .error { color: red; margin-top: 10px; }
        .success { color: green; margin-top: 10px; }
    </style>
</head>
<body>
    <div th:insert="main_html :: main_html"></div>
    
    <div style="max-width: 400px; margin: 50px auto; padding: 20px;">
        <h2>Регистрация</h2>
        
        <form id="registerForm">
            <input type="text" id="username" placeholder="Имя пользователя" required><br>
            <input type="password" id="password" placeholder="Пароль" required><br>
            <button type="submit">Зарегистрироваться</button>
        </form>
        
        <div id="message"></div>
        <p>Уже есть аккаунт? <a href="/login-page">Войти</a></p>
    </div>
    
    <script>
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });
            const text = await response.text();
            
            if (text === "Регистрация успешно завершена") {
                messageDiv.style.color = 'green';
                messageDiv.innerText = text;
                setTimeout(() => { window.location.href = '/login-page'; }, 1500);
            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = text;
            }
        };
    </script>
</body>
</html>
