<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        input { margin: 10px; padding: 8px; width: 200px; }
        button { padding: 8px 20px; background: #333; color: white; border: none; cursor: pointer; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div th:insert="main_html :: main_html"></div>
    
    <div style="max-width: 400px; margin: 50px auto; padding: 20px;">
        <h2>Вход в систему</h2>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="Имя пользователя" required><br>
            <input type="password" id="password" placeholder="Пароль" required><br>
            <button type="submit">Войти</button>
        </form>
        
        <div id="message" class="error"></div>
        <p>Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
    </div>
    
    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    messageDiv.innerText = data.message || 'Ошибка при входе';
                }
            } catch (error) {
                messageDiv.innerText = 'Ошибка соединения с сервером';
            }
        };
    </script>
</body>
</html>
